<script>
/* =====================================================================
   Página do Bruno: reporte dos clientes dele.
   Aba Clientes: situação, início e um reporte geral de cada cliente (o mais atualizado possível).
   Aba Financeiro: mensalidades por grupo, próximo pagamento (dia 20, só quem já completou 30 dias)
   e parcelas pagas dos projetos (R$ 600 em 4 parcelas de R$ 150).
   Sem histórico de otimizações nem prazos de promoção.
   Só a barrinha da promoção vem ao vivo da planilha (pela "conta").
   situacao: "Ativo" ou "Pausada · promoção atingida" (só quem pausou porque já atingiu a promoção).
   ===================================================================== */
const ATUALIZADO_EM = "18/11/2026 às 15:48";

const GRUPOS = [
  { id: "rec", titulo: "Clientes recorrentes", clientes: [
    { nome: "VILA 86", segmento: "Moda streetwear", plataformas: ["meta", "google"], mensal: 200, inicio: "", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "As vendas no Google seguem num bom padrão: 28 conversões de 01 a 18/11 e 14 nos últimos 7 dias, uma média de 1 a 2 vendas por dia. No Meta, o vídeo da loja foi trocado pelo post de Black Friday mais recente deles, para aproveitar o período." },
    { nome: "061 RACING", segmento: "Mecânica de alta performance", plataformas: ["meta"], mensal: 200, inicio: "", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "Campanhas entregando o volume esperado. O lead do remap está um pouco mais caro, e o da campanha de revisão sai mais barato. Estamos entendendo com o cliente qual criativo de revisão traz mais agendamentos, para concentrar o investimento nele. Por enquanto, seguimos com a mesma estratégia e coletando o feedback do cliente." },
  ] },
  { id: "recpsi", titulo: "Psicólogos recorrentes", clientes: [
    { nome: "NARA", segmento: "Psicologia", plataformas: ["google"], conta: "775-492-4225", mensal: 200, inicio: "30/09/2026", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "A campanha roda para atendimento online, em mais regiões e só em dias de semana. Na última revisão, ajustamos palavras-chave e público-alvo. Os contatos chegaram, mas praticamente não viraram resultado no período, e os termos de pesquisa estão fracos. A cliente decidiu pausar as campanhas em breve; nesse intervalo, vamos reformular o site e mudar a estratégia antes de voltar." },
    { nome: "NATHALIA", segmento: "Psicologia", plataformas: ["google"], mensal: 200, inicio: "23/09/2026", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "Campanha local, só na região de São Carlos, com foco em contatos de perfil mais high ticket. Por isso o custo por contato é maior, mas já houve retornos positivos e fechamentos. Na última revisão, incluímos novas palavras-chave para aumentar o volume de conversões e concentramos o investimento numa só campanha, a que mais converte. A verificação da conta precisa ser feita até 02/12." },
    { nome: "CLÉCIA", segmento: "Psicologia", plataformas: ["google"], conta: "128-846-8174", mensal: 200, inicio: "22/09/2026", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "Verificação da conta feita e campanhas de volta ao ar. As conversões caíram um pouco na última semana, então ajustamos palavras-chave e termos de pesquisa, com novas palavras e alguns termos removidos. A cliente pediu para seguir investindo até cerca de R$ 1.400 no total, e ela já confirmou alguns fechamentos." },
    { nome: "HUGO", segmento: "Psicologia", plataformas: ["google"], conta: "587-222-5596", mensal: 200, inicio: "29/09/2026", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "As conversões caíram bastante nos últimos dias, então ajustamos palavras-chave, termos de pesquisa e anúncios, e o orçamento foi para R$ 20 por dia. O cliente segue fazendo recargas para manter as campanhas rodando. Como a campanha roda só em Recife, estamos avaliando expandir a localização para ganhar volume." },
  ] },
  { id: "proj", titulo: "Psicólogos de projeto", clientes: [
    { nome: "SHEILA", segmento: "Psicologia", plataformas: ["google"], conta: "353-831-5205", mensal: 150, parcelas: 1, inicio: "24/09/2026", revisao: "18/11/2026", situacao: "Pausada · promoção atingida",
      reporte: "Campanhas pausadas: a conta está sem saldo, e a cliente deve aguardar a entrada dos créditos do Google para voltar. O resultado ficou abaixo do esperado, com pouquíssimos fechamentos; por isso, vamos reestruturar a dinâmica para a volta, com alterações nas campanhas e, principalmente, no site. A verificação da conta já foi feita." },
    { nome: "CARMEM", segmento: "Psicologia", plataformas: ["google"], conta: "918-578-8000", mensal: 150, parcelas: 0, inicio: "05/10/2026", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "A cliente deu um retorno positivo nos últimos dias: está conseguindo fechar com alguns clientes, e o resultado está bem interessante. A pedido dela, ajustamos o público e as palavras-chave das campanhas na última revisão. A verificação da conta está concluída." },
    { nome: "THAYNARA", segmento: "Psicologia", plataformas: ["google"], conta: "337-837-5511", mensal: 150, parcelas: 1, inicio: "03/09/2026", revisao: "16/11/2026", situacao: "Pausada · promoção atingida",
      reporte: "Campanhas pausadas: a cliente prefere aguardar a entrada dos créditos do Google para voltar a investir. A conta está em ordem e sem verificação pendente. Os créditos ainda não entraram, e vamos conferir de novo na quarta-feira (18/11)." },
    { nome: "DANIELLE", segmento: "Psicologia", plataformas: ["google"], conta: "150-686-1633", mensal: 150, parcelas: 1, inicio: "14/09/2026", revisao: "18/11/2026", situacao: "Pausada · promoção atingida",
      reporte: "Campanhas pausadas até a entrada dos créditos do Google, como a cliente preferiu. Para a volta, ela quer testar uma dinâmica diferente, voltada para clínica, o que deve incluir mudanças no site; estamos levantando e organizando essa proposta antes do retorno. A conta está sem verificação pendente." },
    { nome: "ALICE", segmento: "Psicologia", plataformas: ["google"], conta: "357-411-5648", mensal: 150, parcelas: 1, inicio: "14/09/2026", revisao: "18/11/2026", situacao: "Ativo",
      reporte: "O resultado segue interessante, com contatos fechados pela cliente; estamos levantando com ela quantos foram desde o início das campanhas e como estão os contatos dos últimos dias. A recarga anterior acabou, e a nova já foi solicitada à cliente, que optou por seguir com as campanhas. Na última revisão, fizemos ajustes de rotina. A verificação da conta está pendente, ainda sem prazo." },
    { nome: "YASMIN", segmento: "Psicologia", plataformas: ["google"], conta: "756-159-1841", mensal: 150, parcelas: 1, inicio: "30/09/2026", revisao: "16/11/2026", situacao: "Pausada · promoção atingida",
      reporte: "Campanhas pausadas até a entrada dos créditos do Google, que ainda não caíram. Ainda não tivemos retorno da cliente sobre os resultados, e estamos retomando o contato. A verificação da conta (confirmação de telefone) precisa ser feita até 20/11." },
    { nome: "THAIS", segmento: "Psicologia", plataformas: ["google"], conta: "337-708-3643", mensal: 150, parcelas: 0, inicio: "11/11/2026", revisao: "16/11/2026", situacao: "Ativo",
      reporte: "Campanhas no ar desde 11/11, com foco, por enquanto, no atendimento online. Na última revisão, ajustamos os termos de pesquisa; agora vamos confirmar com a cliente como foram os últimos contatos e fazer otimizações maiores na quarta-feira (18/11). A verificação do anunciante precisa ser feita até 15/12." },
    { nome: "NEIVA", segmento: "Psicologia", plataformas: ["google"], mensal: 150, parcelas: 0, inicio: "", revisao: "", situacao: "Ativo",
      reporte: "Site pronto. Estamos pegando o acesso ao domínio (Registro.br), e a cliente vai criar a conta de anúncios; as campanhas começam assim que a conta estiver pronta." },
  ] },
];

/* Pagamento do Bruno: todo dia 20, só dos clientes que já completaram 30 dias desde o início */
const DIA_PAGAMENTO = 20;
</script>
<style>
  :root {
    --bg: #0f0f0f;
    --box: #143a2b;
    --box-ink: #e4eee8;
    --box-label: #a3c2b1;
    --box-line: #2a5a45;
    --surface: #ffffff;
    --ink: #1a1f24;
    --label: #8a929b;
    --soft-ink: #4a535c;
    --line: #e4ebe7;
    --row-soft: #f2f6f4;
    --title: #f0d78c;
    --bar: #2f7a57;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; color-scheme: light; scrollbar-gutter: stable; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  .wrap { padding: 32px 40px 44px; }
  /* Largura fixa (igual nas duas abas), para o cabeçalho não mudar de lugar */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); width: min(1240px, 100%); margin: 0 auto; gap: 26px; }

  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 2px 2px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, .12);
    color: var(--box-ink);
    font-size: 16px; font-weight: 700; letter-spacing: .02em;
  }
  .top svg { display: block; flex: none; }
  .tabs { display: flex; gap: 4px; }
  .tabs a { padding: 5px 12px; color: var(--box-ink); opacity: .65; text-decoration: none; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .tabs a:hover { opacity: 1; }
  .tabs a[aria-current="page"] { opacity: 1; background: var(--box); color: #fff; box-shadow: inset 0 0 0 1px var(--box-line); }
  .updated { margin-left: auto; padding: 3px 10px; border: 1px solid rgba(255, 255, 255, .2); font-size: 12.5px; font-weight: 500; letter-spacing: 0; }

  section { min-width: 0; background: var(--box); border: 1px solid var(--box-line); padding: 16px 20px 20px; }
  .aba > section + section, .aba > section + .fin-grupo, .fin-grupo + .fin-grupo { margin-top: 30px; }
  section h2 {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 12px 2px; font-size: 12px; font-weight: 600; color: var(--title);
    text-transform: uppercase; letter-spacing: .08em;
  }
  section h2 span { color: var(--box-label); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .cards { display: grid; gap: 10px; }

  /* Card de cada cliente */
  .card { padding: 13px 16px 14px; background: var(--surface); border: 1px solid var(--line); }
  .dados { display: grid; grid-template-columns: minmax(250px, 1.2fr) minmax(250px, 1.1fr) minmax(220px, 1.2fr) minmax(150px, .8fr); align-items: center; font-variant-numeric: tabular-nums; }
  .dados > div { min-width: 0; padding: 0 20px; border-left: 1px solid var(--line); white-space: nowrap; }
  .dados > div:first-child { padding-left: 0; border-left: 0; }
  .k { display: block; font-size: 11px; color: var(--label); }
  .v { display: block; font-size: 13px; font-weight: 500; }
  .nome { font-size: 13px; font-weight: 700; letter-spacing: .01em; }
  .seg { display: block; font-size: 11.5px; font-weight: 500; letter-spacing: 0; color: var(--label); }
  .plat { display: inline-block; width: 14px; height: 14px; margin-left: 6px; vertical-align: -2px; }
  .plat + .plat { margin-left: 4px; }
  .plat svg { display: block; width: 100%; height: 100%; }
  .sit-cell .v { display: flex; align-items: center; gap: 8px; }
  .sit-cell small { font-size: 11.5px; color: var(--label); }
  .dados > .promo { grid-column: 3; }
  /* Mensalidade e parcelas bem discretas, no canto direito */
  .dados > .disc { grid-column: 4; padding-right: 0; border-left: 0; text-align: right; font-size: 11px; color: var(--label); }
  .barra-linha { display: flex; align-items: center; gap: 10px; height: 19px; }
  .barra { flex: 1; height: 7px; background: var(--line); }
  .barra i { display: block; height: 100%; background: var(--bar); }
  .barra-linha b { min-width: 34px; text-align: right; font-size: 12.5px; font-weight: 600; }

  /* Situação: "Ativo" em verde; "Pausada · promoção atingida" neutro */
  .sit { display: inline-block; padding: 1px 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; background: #eef1ef; color: var(--soft-ink); white-space: nowrap; }
  .sit.rodando { background: #e3f1e9; color: #1f6b47; }
  .sit.nao-iniciada { background: none; box-shadow: inset 0 0 0 1px #cfd6d2; color: var(--label); }

  .textos { display: grid; gap: 6px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
  .texto { margin: 0; font-size: 12.5px; color: var(--soft-ink); text-wrap: pretty; } /* evita palavra sozinha na última linha */
  .texto b { margin-right: 6px; font-size: 11px; font-weight: 700; color: var(--label); text-transform: uppercase; letter-spacing: .04em; }

  /* Aba Financeiro: total do dia 20 em destaque e uma lista simples de clientes, por grupo */
  .fin-total, .fin-card { max-width: 760px; }
  .fin-total { padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--bar); }
  .fin-total .k { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .fin-total .v { margin-top: 4px; font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .fin-total .s { display: block; margin-top: 6px; font-size: 12.5px; color: var(--soft-ink); }
  .fin-card { margin-top: 16px; padding: 4px 20px 16px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .fin-grupo h3 { display: flex; justify-content: space-between; gap: 16px; margin: 14px 0 4px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .fin-grupo h3 b { font-size: 13px; letter-spacing: 0; }
  .fin-grupo .obs { margin: 6px 0 2px; font-size: 12px; color: var(--label); }
  .fin-lista { margin: 0; padding: 0; list-style: none; }
  .fin-lista li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .fin-lista .cli { font-weight: 700; }
  .fin-lista small { display: block; margin-top: 1px; font-size: 11.5px; font-weight: 500; color: var(--label); }
  .fin-lista .val { font-weight: 600; white-space: nowrap; }
  .fin-lista li.fora .cli { color: var(--label); }
  .fin-lista li.fora small { color: #8a5a12; }
  .fin-lista li.fora .val { color: var(--label); }
  .fin-soma { display: flex; justify-content: space-between; gap: 16px; margin-top: 14px; padding: 12px 14px; background: var(--row-soft); font-size: 15px; font-weight: 700; }

  @media (max-width: 1000px) {
    .wrap { padding: 16px; }
    .updated { margin-left: 0; }
    section { padding: 12px; }
    .dados { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start; }
    .dados > div { padding: 0; border-left: 0; white-space: normal; }
    .dados > div:first-child, .dados > .promo, .dados > .disc { grid-column: 1 / -1; }
    .dados > .disc { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <header class="top">
      <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true">
        <defs><clipPath id="avatar-clip"><circle cx="32" cy="32" r="32"/></clipPath></defs>
        <g clip-path="url(#avatar-clip)">
          <rect width="64" height="64" fill="#2f7a57"/>
          <circle cx="32" cy="25" r="11" fill="#fff"/>
          <path d="M9 68c0-15 10-25 23-25s23 10 23 25z" fill="#fff"/>
        </g>
      </svg>
      <nav class="tabs" aria-label="Abas">
        <a href="#clientes" data-tab="clientes">Clientes</a>
        <a href="#financeiro" data-tab="financeiro">Financeiro</a>
      </nav>
      <span class="updated" id="updated"></span>
    </header>
    <main class="aba" id="aba-clientes"></main>
    <main class="aba" id="aba-financeiro" hidden></main>
  </div>
</div>

<script>
(function () {
  const DAY = 86400000;
  const PARCELAS = 4; // projeto de R$ 600 dividido em 4 parcelas de R$ 150
  const money = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isDate = s => /^\d\d\/\d\d\/\d{4}$/.test(s || "");
  const parseDate = s => { if (!isDate(s)) return null; const [d, m, y] = s.split("/").map(Number); return Date.UTC(y, m - 1, d); };
  const ddmm = t => { const d = new Date(t); return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
  const today = () => { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); };
  const qtd = n => `${n} cliente${n === 1 ? "" : "s"}`;

  const PLATFORMS = {
    google: { title: "Google Ads", svg: `<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>` },
    meta: { title: "Meta Ads", svg: `<svg viewBox="0 0 24 24"><path d="M12 12c-2-3-3.6-5.2-5.6-5.2S2.8 9 2.8 12s1.6 5.2 3.6 5.2S10 15 12 12s3.6-5.2 5.6-5.2 3.6 2.2 3.6 5.2-1.6 5.2-3.6 5.2S14 15 12 12z" fill="none" stroke="#0866FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
  };

  const sitClasse = s => s === "Ativo" ? "rodando" : "";
  const sit = s => `<span class="sit ${sitClasse(s)}">${esc(s)}</span>`;

  /* Promoção do Google: só a barrinha e o percentual de R$ 1.200 gastos, lidos ao vivo da aba "Geral" da planilha */
  const SHEET_CSV = "https://docs.google.com/spreadsheets/d/14wsRMmTuI7v7nT2yy6AXYKzlhBHNkznw4XXsen69xxE/gviz/tq?tqx=out:csv&sheet=Geral";
  const META = 1200;
  const gastoPorConta = {};
  const toNumber = s => parseFloat(String(s || "").replace(/[^\d,-]/g, "").replace(",", ".")) || 0;

  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  /* ===== Pagamento: próximo dia 20 e quem entra nele ===== */
  function proximoPagamento() {
    const n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth() + (n.getDate() > DIA_PAGAMENTO ? 1 : 0), DIA_PAGAMENTO);
  }
  // Primeiro dia 20 em que o cliente já tem 30 dias desde o início
  function primeiroPagamento(inicio) {
    const t = parseDate(inicio) + 30 * DAY, d = new Date(t);
    const mesmo = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), DIA_PAGAMENTO);
    return mesmo >= t ? mesmo : Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, DIA_PAGAMENTO);
  }
  // Recorrentes sem data de início são clientes antigos e entram; projetos sem início ainda não começaram
  function noPagamento(c, g, data) {
    if (isDate(c.inicio)) {
      const p = primeiroPagamento(c.inicio);
      return p <= data ? { entra: true } : { entra: false, txt: `A partir de ${ddmm(p)}` };
    }
    return g.id === "proj" ? { entra: false, txt: "Após o início" } : { entra: true };
  }

  /* ===== Aba Clientes ===== */
  function card(c) {
    const plats = (c.plataformas || []).map(p => `<span class="plat" title="${PLATFORMS[p].title}">${PLATFORMS[p].svg}</span>`).join("");
    const gasto = c.conta ? gastoPorConta[c.conta] : undefined;
    const pct = gasto == null ? 0 : Math.min(Math.floor(gasto / META * 100), 100);
    const promo = c.conta ? `<div class="promo"><span class="k">Promoção Google</span><span class="barra-linha">` +
      `<span class="barra"><i style="width:${pct}%"></i></span><b>${gasto == null ? "—" : pct + "%"}</b></span></div>` : "";
    const textos = c.reporte ? `<p class="texto"><b>Reporte</b>${esc(c.reporte)}</p>` : "";
    return `<article class="card"><div class="dados">` +
      `<div><span class="nome">${esc(c.nome)}${plats}</span><span class="seg">${esc(c.segmento)}</span></div>` +
      `<div class="sit-cell"><span class="k">Situação · início ${isDate(c.inicio) ? c.inicio.slice(0, 5) : "—"}</span><span class="v">${sit(c.situacao)}</span></div>` +
      promo +
      `<div class="disc">${money(c.mensal)}${c.parcelas != null ? ` · ${c.parcelas} de ${PARCELAS} parcelas` : ""}</div>` +
      `</div><div class="textos">${textos}</div></article>`;
  }

  // Revisão mais recente primeiro; mesma data → ordem alfabética; sem data no fim
  const ordem = lista => lista.slice().sort((a, b) =>
    (parseDate(b.revisao) ?? -Infinity) - (parseDate(a.revisao) ?? -Infinity) || a.nome.localeCompare(b.nome, "pt-BR"));

  function renderClientes() {
    document.getElementById("aba-clientes").innerHTML = GRUPOS.map(g =>
      `<section><h2>${esc(g.titulo)} <span>${qtd(g.clientes.length)}</span></h2>` +
      `<div class="cards">${ordem(g.clientes).map(card).join("")}</div></section>`).join("");
  }

  /* ===== Aba Financeiro ===== */
  function renderFinanceiro() {
    const data = proximoPagamento();
    const dia = ddmm(data);
    const todos = GRUPOS.flatMap(g => g.clientes.map(c => ({ c, g, pag: noPagamento(c, g, data) })));
    const soma = l => l.reduce((s, x) => s + (x.c.mensal || 0), 0);
    const entram = todos.filter(x => x.pag.entra);
    const faltam = Math.round((data - today()) / DAY);
    const quando = faltam === 0 ? "é hoje" : faltam === 1 ? "é amanhã" : `faltam ${faltam} dias`;

    // Total a pagar no dia 20, em destaque
    const topo = `<div class="fin-total"><span class="k">A pagar no dia ${dia}</span><span class="v">${money(soma(entram))}</span>` +
      `<span class="s">${qtd(entram.length)} · ${quando}. Contam só os clientes com pelo menos 30 dias de campanha rodando.</span></div>`;

    // Lista simples: cada cliente e quanto representa no dia 20, separada por grupo, com o subtotal de cada grupo
    const linha = ({ c, g, pag }) => {
      // Deixa claro que o pagamento do dia é a próxima parcela, e quantas já foram pagas antes dele
      const pagas = c.parcelas || 0;
      const parcela = g.id === "proj" && pag.entra ? `Neste pagamento (${dia}): ${pagas + 1}ª parcela de ${PARCELAS} · ${pagas ? `${pagas} já paga${pagas > 1 ? "s" : ""}` : "nenhuma paga ainda"}` : "";
      const nota = pag.entra ? parcela : "Não conta: ainda não completou 30 dias de campanha rodando";
      return `<li${pag.entra ? "" : ` class="fora"`}><span class="cli">${esc(c.nome)}${nota ? `<small>${esc(nota)}</small>` : ""}</span>` +
        `<span class="val">${pag.entra ? money(c.mensal) : "—"}</span></li>`;
    };
    const grupo = g => {
      const linhas = todos.filter(x => x.g === g);
      return `<div class="fin-grupo"><h3><span>${esc(g.titulo)}</span><b>${money(soma(linhas.filter(x => x.pag.entra)))}</b></h3>` +
        (g.id === "proj" ? `<p class="obs">Combinado: R$ 600 por projeto, em 4 parcelas de R$ 150.</p>` : "") +
        `<ul class="fin-lista">${linhas.map(linha).join("")}</ul></div>`;
    };

    document.getElementById("aba-financeiro").innerHTML =
      `<section><h2>Pagamento do dia ${dia}</h2>${topo}<div class="fin-card">${GRUPOS.map(grupo).join("")}` +
      `<div class="fin-soma"><span>Total no dia ${dia}</span><b>${money(soma(entram))}</b></div></div></section>`;
  }

  function render() {
    document.getElementById("updated").textContent = `Atualizado em ${ATUALIZADO_EM}`;
    renderClientes();
    renderFinanceiro();
  }

  // Abas: a aba aberta fica no endereço (#clientes ou #financeiro); os ids das abas são diferentes para o navegador não rolar a página
  function showTab() {
    const aba = location.hash === "#financeiro" ? "financeiro" : "clientes";
    document.getElementById("aba-clientes").hidden = aba !== "clientes";
    document.getElementById("aba-financeiro").hidden = aba !== "financeiro";
    document.querySelectorAll(".tabs a").forEach(a => {
      if (a.dataset.tab === aba) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }
  addEventListener("hashchange", showTab);
  render();
  showTab();

  // "conta" só existe nos clientes que entram na promoção; só essas linhas da planilha são usadas
  const contas = GRUPOS.flatMap(g => g.clientes.map(c => c.conta)).filter(Boolean);
  fetch(SHEET_CSV)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const all = parseCSV(text);
      const total = (all[0] || []).findIndex(s => /^TODO O PERÍODO/.test((s || "").trim().toUpperCase()));
      if (total < 0) return;
      all.slice(1).filter(r => r[1] && contas.includes(r[1].trim())).forEach(r => { gastoPorConta[r[1].trim()] = toNumber(r[total]); });
      renderClientes();
    })
    .catch(() => {}); // sem a planilha, a barrinha fica vazia e o resto da página continua normal
})();
</script>
</body>
</html>
