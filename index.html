<style>
  :root {
    --bg: #0f0f0f;
    --box: #fcf4d8;
    --box-line: #ede0b3;
    --surface: #ffffff;
    --ink: #1a1f24;
    --label: #8a929b;
    --soft-ink: #4a535c;
    --line: #f0e9d0;
    --accent: #2c6a4c;
    --accent-soft: #e8f3ec;
    --accent-soft-ink: #24593f;
    --warn-ink: #b45309;
    --danger-ink: #c0261b;
    --shadow: 0 1px 2px rgba(16, 24, 32, .04);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; color-scheme: light; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 24px 40px 32px; }
  @media (max-width: 600px) { .wrap { padding: 16px; } }

  /* Caixas de clientes uma embaixo da outra, com o cabeçalho em cima; o conjunto fica centralizado */
  .layout { display: grid; grid-template-columns: minmax(0, max-content); justify-content: center; align-items: start; gap: 18px; }
  .top { grid-column: 1 / -1; }

  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 2px 14px;
    border-bottom: 1px solid rgba(252, 244, 216, .14);
    color: var(--box);
    font-size: 16px; font-weight: 700; letter-spacing: .02em;
  }
  .top svg { display: block; flex: none; }
  .top { flex-wrap: wrap; }

  /* Abas do topo: Clientes / Google Ads */
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs a {
    padding: 5px 12px; border-radius: 999px;
    color: var(--box); opacity: .65; text-decoration: none;
    font-size: 14px; font-weight: 600; letter-spacing: .01em;
  }
  .tabs a:hover { opacity: 1; }
  .tabs a[aria-current="page"] { opacity: 1; background: var(--box); color: var(--ink); }
  [hidden] { display: none !important; }

  /* Aba Google Ads (lida ao vivo da aba "Geral" da planilha) */
  /* Cada métrica tem Hoje, Ontem e 7 dias lado a lado */
  /* Larguras fixas para as colunas das duas caixas ficarem alinhadas entre si */
  .cards.ads { --cols: 300px 118px repeat(3, 94px) repeat(3, 72px) repeat(3, 94px) 236px minmax(0, 1fr); overflow-x: auto; }
  .cards.ads .c, .cards.ads .sort { padding-left: 9px; padding-right: 9px; }
  .cards.ads .card.head { row-gap: 0; }
  .cards.ads .group {
    grid-row: 1; margin: 0 0 1px; padding: 2px 9px 3px;
    border-left: 2px solid var(--box-line); border-bottom: 1px solid var(--box-line);
    font-size: 11px; font-weight: 700; color: var(--soft-ink); text-transform: uppercase; letter-spacing: .05em; text-align: center;
  }
  .cards.ads .card.head .sort { grid-row: 2; }
  .cards.ads .gstart { border-left: 2px solid var(--box-line); }
  .sub { display: block; margin-top: 1px; font-size: 11.5px; font-weight: 500; letter-spacing: 0; color: var(--label); }
  .alert { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .alert.ok { background: var(--accent-soft); color: var(--accent-soft-ink); }
  .alert.warn { background: #fff0d6; color: var(--warn-ink); }
  .alert.crit { background: #fde5e2; color: var(--danger-ink); }
  .ads-msg { grid-column: 1 / -1; margin: 0; padding: 12px 14px; background: var(--surface); border-radius: 8px; color: var(--soft-ink); }
  .sections { display: grid; grid-template-columns: minmax(0, max-content); gap: 14px; }

  /* Aba Clientes: caixas à esquerda e a tabelinha de pendências à direita (embaixo em telas menores) */
  .clientes-wrap { display: grid; grid-template-columns: minmax(0, max-content) 230px; gap: 18px; align-items: start; }
  @media (max-width: 1340px) { .clientes-wrap { grid-template-columns: minmax(0, max-content); } }
  .side {
    position: sticky; top: 16px;
    background: var(--surface); border: 1px solid var(--box-line); border-radius: 12px;
    padding: 12px 16px 10px; font-size: 13px; color: var(--soft-ink);
  }
  @media (max-width: 1340px) { .side { position: static; } }
  .side h3 { margin: 0 0 4px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--label); }
  .side h4 { margin: 8px 0 2px; font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .side h3 + h4 { margin-top: 2px; }
  .side ul { margin: 0; padding-left: 16px; }
  .side li { padding: 1px 0; }
  .side li::marker { color: var(--label); }
  .side .when { color: var(--label); }
  .side .block + .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }

  /* Cada seção (Recorrentes, Recorrentes · Psicólogos, Projetos · Psicólogos) fica dentro de uma caixa com contorno */
  section {
    min-width: 0;
    background: var(--box);
    border: 1px solid var(--box-line);
    border-radius: 14px;
    padding: 10px 12px 12px;
  }
  section h2 {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 4px 2px; font-size: 12px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: .08em;
  }
  section h2 span { color: var(--label); font-weight: 500; text-transform: none; letter-spacing: 0; }

  /* As colunas são compartilhadas por todos os cards da seção (subgrid),
     então cada coluna tem a largura do seu maior conteúdo e nada quebra linha. */
  .cards { display: grid; grid-template-columns: var(--cols); row-gap: 6px; }
  /* Larguras fixas para as colunas das duas caixas ficarem alinhadas entre si */
  .cards { --cols: 204px 182px 138px 76px 112px 112px 112px minmax(0, 1fr); }

  .card {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: subgrid;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 0;
    box-shadow: var(--shadow);
  }
  .card.head { background: transparent; border-color: transparent; box-shadow: none; padding: 0; }

  .c {
    min-width: 0;
    padding: 0 14px;
    border-left: 1px solid var(--line);
    font-variant-numeric: tabular-nums; font-weight: 500;
    white-space: nowrap;
  }
  .c:first-child { border-left: 0; }
  .c.name { font-weight: 700; letter-spacing: .01em; }
  .seg { display: block; margin-top: 1px; font-size: 11.5px; font-weight: 500; letter-spacing: 0; color: var(--label); }
  /* Símbolo da plataforma (Google / Meta) ao lado do nome */
  .plat { display: inline-block; width: 14px; height: 14px; margin-left: 6px; vertical-align: -2px; }
  .plat + .plat { margin-left: 4px; }
  .c.empty { color: var(--label); }
  .c.next.late { color: var(--danger-ink); font-weight: 600; }
  .c.next.today { color: var(--warn-ink); font-weight: 600; }

  /* Títulos das colunas: clicar ordena */
  .sort {
    display: flex; align-items: center; gap: 4px;
    width: 100%; padding: 4px 14px;
    border: 0; border-left: 1px solid transparent; background: none;
    font: inherit; font-size: 11.5px; font-weight: 500; color: var(--label);
    white-space: nowrap; cursor: pointer; text-align: left;
  }
  .sort:hover { color: var(--ink); }
  .sort[aria-sort="ascending"], .sort[aria-sort="descending"] { color: var(--ink); font-weight: 600; }
  .sort .arrow { font-size: 10px; opacity: 0; }
  .sort:hover .arrow { opacity: .4; }
  .sort[aria-sort="ascending"] .arrow, .sort[aria-sort="descending"] .arrow { opacity: 1; }

  .pill {
    display: inline-block; padding: 0 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent-soft-ink);
    font-size: 12px; font-weight: 600;
  }

  .note {
    grid-column: 1 / -1;
    contain: inline-size; /* observação longa quebra linha em vez de alargar a caixa */
    margin: 9px 14px 0;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--soft-ink);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .note mark.urgent { background: #fde0c2; }
  .note mark {
    padding: 0 4px; border-radius: 3px;
    background: #fdf1c7; color: inherit;
  }
  .note::before {
    content: "Obs:";
    margin-right: 6px;
    font-size: 11px; font-weight: 700; color: var(--label);
    text-transform: uppercase; letter-spacing: .05em;
  }

  .top .updated { margin-left: auto; padding: 3px 10px; border: 1px solid rgba(252, 244, 216, .25); border-radius: 999px; font-size: 12.5px; font-weight: 500; letter-spacing: 0; }

  /* Telas menores: cada cliente vira um bloco, com rótulos em cada campo */
  @media (max-width: 1000px) {
    body { font-size: 14px; }
    .cards { display: flex; flex-direction: column; gap: 9px; }
    .card.head { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .card.head .sort { width: auto; padding: 3px 9px; border: 1px solid var(--box-line); border-radius: 999px; background: var(--surface); }
    .card { grid-template-columns: repeat(6, 1fr); gap: 6px 12px; padding: 12px 14px; border-radius: 10px; }
    .c { grid-column: span 2; padding: 0; border-left: 0; }
    .c.name { grid-column: 1 / -1; font-size: 15px; }
    .c:nth-child(2), .c:nth-child(3) { grid-column: span 3; }
    .c[data-label]::before {
      content: attr(data-label);
      display: block;
      font-size: 11.5px; font-weight: 500; color: var(--label);
    }
    .note { margin: 0; padding-top: 8px; }

    /* Google Ads no celular: nome e orçamento em cima, depois uma linha por métrica (Hoje | Ontem | 7 dias) */
    .cards.ads .card.head { display: none; }
    .cards.ads .card { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cards.ads .c, .cards.ads .c:nth-child(2), .cards.ads .c:nth-child(3) { grid-column: span 1; padding: 0; border-left: 0; white-space: normal; }
    .cards.ads .c.name, .cards.ads .c:nth-child(2), .cards.ads .c:last-child { grid-column: 1 / -1; }
    .cards.ads .c[data-label]::before { font-size: 11px; }
  }
</style>
</head>
<body>

<script>
(function () {
  const DAY = 86400000;

  function parseDate(s) {
    if (!s) return null;
    const [d, m, y] = s.split("/").map(Number);
    return Date.UTC(y, m - 1, d);
  }
  function fmtDate(t) {
    const d = new Date(t);
    return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + "/" + d.getUTCFullYear();
  }
  function today() {
    const n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  }
  const money = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function cell(label, value, cls, title) {
    const empty = value === "" || value == null;
    return `<div class="c ${cls || ""} ${empty ? "empty" : ""}" data-label="${label}"${title ? ` title="${title}"` : ""}>${empty ? "—" : value}</div>`;
  }

  function nextOf(c) {
    const last = parseDate(c.revisao);
    return last == null ? null : last + 7 * DAY;
  }

  function nextCell(c) {
    const next = nextOf(c);
    if (next == null) return cell("Próxima revisão", "", "next");
    const diff = Math.round((next - today()) / DAY);
    let cls = "next", title = "";
    if (diff < 0) { cls += " late"; title = `Atrasada há ${-diff} dia${diff === -1 ? "" : "s"}`; }
    else if (diff === 0) { cls += " today"; title = "Revisão hoje"; }
    return cell("Próxima revisão", fmtDate(next), cls, title);
  }

  /* Colunas (iguais para todas as caixas). O tipo define o primeiro clique:
     datas e valores começam do mais recente/maior; textos, de A a Z. */
  const COLS = [
    { label: "Cliente", key: c => c.nome, type: "text" },
    { label: "Última revisão/alteração", key: c => parseDate(c.revisao), type: "num" },
    { label: "Próxima revisão", key: nextOf, type: "num" },
    { label: "Script", key: c => c.script, type: "text" },
    { label: "Mensal", key: c => c.mensal, type: "num" },
    { label: "Pagamento", key: c => c.pagamento, type: "text" },
    { label: "Início", key: c => parseDate(c.inicio), type: "num" },
  ];

  // Cliente dono de cada conta do Google Ads (pelo campo "conta")
  const CLIENT_BY_ACCOUNT = Object.fromEntries(RECORRENTES.concat(RECORRENTES_PSICOLOGOS, PROJETOS).filter(c => c.conta).map(c => [c.conta, c]));

  const PLATFORMS = {
    google: { title: "Google Ads", svg: `<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>` },
    meta: { title: "Meta Ads", svg: `<svg viewBox="0 0 24 24"><path d="M12 12c-2-3-3.6-5.2-5.6-5.2S2.8 9 2.8 12s1.6 5.2 3.6 5.2S10 15 12 12s3.6-5.2 5.6-5.2 3.6 2.2 3.6 5.2-1.6 5.2-3.6 5.2S14 15 12 12z" fill="none" stroke="#0866FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
  };

  function card(c) {
    const plats = (c.plataformas || []).filter(p => PLATFORMS[p])
      .map(p => `<span class="plat" title="${PLATFORMS[p].title}" role="img" aria-label="${PLATFORMS[p].title}">${PLATFORMS[p].svg}</span>`).join("");
    let html = `<div class="c name">${esc(c.nome)}${plats}<span class="seg">${c.segmento ? esc(c.segmento) : "&nbsp;"}</span></div>`
      + cell("Última revisão/alteração", esc(c.revisao))
      + nextCell(c)
      + cell("Script", esc(c.script))
      + cell("Mensal", c.mensal != null ? money(c.mensal) : "")
      + cell("Pagamento", c.pagamento ? `<span class="pill">${esc(c.pagamento)}</span>` : "")
      + cell("Início", esc(c.inicio));
    // Na observação: **trecho** = marcador amarelo (verificação/promoção); !!trecho!! = laranja (saldo/recarga)
    const obs = c.obs ? esc(c.obs)
      .replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>")
      .replace(/!!(.+?)!!/g, `<mark class="urgent">$1</mark>`) : "&nbsp;";
    html += `<p class="note">${obs}</p>`; // a linha de OBS aparece sempre, mesmo vazia
    return `<article class="card" data-cliente="${esc(c.nome)}">${html}</article>`;
  }

  // Ordem padrão de cada caixa: revisão mais recente no topo; mesma data → ordem alfabética;
  // quem não tem revisão vai para o fim
  function byReview(list) {
    return list.slice().sort((a, b) =>
      (parseDate(b.revisao) ?? -Infinity) - (parseDate(a.revisao) ?? -Infinity) ||
      a.nome.localeCompare(b.nome, "pt-BR"));
  }

  // Ordenação de cada seção: coluna (índice) e direção (1 = crescente, -1 = decrescente)
  const state = { rec: { col: null, dir: 1 }, recpsi: { col: null, dir: 1 }, proj: { col: null, dir: 1 } };
  const DATA = { rec: RECORRENTES, recpsi: RECORRENTES_PSICOLOGOS, proj: PROJETOS };

  function sorted(kind) {
    const { col, dir } = state[kind];
    const list = byReview(DATA[kind]).map((c, i) => ({ c, i }));
    if (col == null) return list.map(x => x.c);
    const { key, type } = COLS[col];
    const isEmpty = v => v == null || v === "";
    list.sort((a, b) => {
      const va = key(a.c), vb = key(b.c);
      if (isEmpty(va) || isEmpty(vb)) return (isEmpty(va) - isEmpty(vb)) || a.i - b.i; // vazios sempre no fim
      const cmp = type === "num" ? va - vb : String(va).localeCompare(String(vb), "pt-BR");
      return cmp * dir || a.i - b.i;
    });
    return list.map(x => x.c);
  }

  function render(kind) {
    const { col, dir } = state[kind];
    const head = COLS.map((h, i) => {
      const sort = col === i ? (dir === 1 ? "ascending" : "descending") : "none";
      const arrow = col === i ? (dir === 1 ? "▲" : "▼") : (h.type === "num" ? "▼" : "▲");
      return `<button type="button" class="sort" data-kind="${kind}" data-col="${i}" aria-sort="${sort}" title="Ordenar por ${h.label}">${h.label}<span class="arrow">${arrow}</span></button>`;
    }).join("");
    document.getElementById(kind).innerHTML =
      `<div class="card head">${head}</div>` + sorted(kind).map(card).join("");
  }

  // 1º clique: ordena (datas e valores do maior para o menor; textos de A a Z).
  // 2º clique: inverte. 3º clique: volta à ordem original.
  document.addEventListener("click", e => {
    const b = e.target.closest(".sort[data-kind]");
    if (!b) return;
    const kind = b.dataset.kind, i = Number(b.dataset.col);
    const s = state[kind], first = COLS[i].type === "num" ? -1 : 1;
    if (s.col !== i) { s.col = i; s.dir = first; }
    else if (s.dir === first) s.dir = -first;
    else s.col = null;
    render(kind);
  });

  /* Tabelinha lateral: tirada dos campos verificacao / saldo / promocao de cada cliente.
     Urgentes (verificação e saldo) em cima; promoções embaixo. Com data, a mais próxima primeiro. */
  const ALL = RECORRENTES.concat(RECORRENTES_PSICOLOGOS, PROJETOS);
  const isDate = d => /^\d\d\/\d\d\/\d{4}$/.test(d || "");
  const dateVal = d => isDate(d) ? parseDate(d) : Infinity; // sem data vai para o fim
  const byDate = field => (a, b) => dateVal(a[field]) - dateVal(b[field]) || a.nome.localeCompare(b.nome, "pt-BR");
  const when = d => isDate(d) ? `até ${d.slice(0, 5)}` : d;
  const li = (nome, txt) => `<li>${esc(nome)}${txt ? ` <span class="when">· ${esc(txt)}</span>` : ""}</li>`;
  const verif = ALL.filter(c => c.verificacao).sort(byDate("verificacao"))
    .map(c => li(c.nome, when(c.verificacao) + (c.verificacaoNota ? ` (${c.verificacaoNota})` : "")));
  const saldo = ALL.filter(c => c.saldo).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")).map(c => li(c.nome));
  const promo = ALL.filter(c => c.promocao).sort(byDate("promocao")).map(c => li(c.nome, when(c.promocao)));
  const list = items => items.length ? `<ul>${items.join("")}</ul>` : `<ul><li>Nada pendente</li></ul>`;
  document.getElementById("side").innerHTML =
    `<div class="block"><h3>Urgente</h3><h4>Realizar verificação</h4>${list(verif)}<h4>Colocar saldo</h4>${list(saldo)}</div>` +
    `<div class="block"><h3>Promoções</h3>${list(promo)}</div>`;

  Object.keys(DATA).forEach(kind => {
    document.getElementById(`count-${kind}`).textContent = `${DATA[kind].length} clientes`;
    render(kind);
  });

  /* ===== Aba Google Ads: lida ao vivo da aba "Geral" da planilha do Google ===== */
  const SHEET_CSV = "https://docs.google.com/spreadsheets/d/14wsRMmTuI7v7nT2yy6AXYKzlhBHNkznw4XXsen69xxE/gviz/tq?tqx=out:csv&sheet=Geral";
  // Posição das colunas na planilha: 0 cliente, 1 ID, 2 status, 3 orçamento/dia,
  // cada período tem 9 métricas a partir da coluna indicada, 31 alertas, 32 atualizado em.
  // Das 9 métricas (Custo, Impr., Cliques, CTR, CPC méd., CPM, Conv., Taxa conv., Custo/conv.)
  // mostramos Custo (posição 0), Conv. (6) e Custo/conv. (8), cada uma com os três períodos lado a lado.
  const PERIODS = [["Hoje", 4], ["Ontem", 13], ["7 dias", 22]];
  const GROUPS = [["Gasto", 0], ["Conversões", 6], ["Custo/conv.", 8]];

  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  const blank = v => !v || v.trim() === "" || v.trim() === "–";
  const toNum = v => blank(v) ? null : parseFloat(v.replace(/[R$\s%.]/g, "").replace(",", "."));

  // Ordenação separada para cada caixa (Recorrentes Psicólogos / Projetos Psicólogos), como na aba Clientes
  const ads = { rows: null, loading: false, updated: "", sort: { rec: { col: null, dir: 1 }, proj: { col: null, dir: 1 } } };
  const REC_ACCOUNTS = new Set(RECORRENTES.concat(RECORRENTES_PSICOLOGOS).map(c => c.conta).filter(Boolean));
  const displayName = r => { const cli = CLIENT_BY_ACCOUNT[r[1].trim()]; return cli ? cli.nome : r[0].trim(); };

  const ADS_COLS = [
    { label: "Conta", key: displayName, type: "text" },
    { label: "Orçamento/dia", key: r => toNum(r[3]), type: "num", cell: r => r[3] },
    ...GROUPS.flatMap(([g, off]) => PERIODS.map(([p, start], j) => ({
      group: g, gstart: j === 0, label: p, full: `${g} · ${p}`,
      key: r => toNum(r[start + off]), type: "num", cell: r => r[start + off],
    }))),
    { label: "Alertas", key: r => r[31], type: "text" },
  ];

  function adsCard(r) {
    const alert = (r[31] || "").trim();
    const level = /^crítico/i.test(alert) ? "crit" : /^atenção/i.test(alert) ? "warn" : "ok";
    const when = (r[32] || "").trim().replace(/^(\d\d\/\d\d)\/\d{4}/, "$1");
    // Mesmo nome da aba Clientes; o nome da conta e o ID ficam embaixo
    const id = r[1].trim(), cli = CLIENT_BY_ACCOUNT[id];
    let html = `<div class="c name" title="${esc(r[2].trim())}">${esc(cli ? cli.nome : r[0].trim())}<span class="sub">${esc(r[0].trim())} · ${esc(id)}</span></div>`;
    html += ADS_COLS.slice(1, -1).map(c => cell(c.full || c.label, blank(c.cell(r)) ? "" : esc(c.cell(r).trim()), c.gstart ? "gstart" : "")).join("");
    html += cell("Alertas", alert ? `<span class="alert ${level}">${esc(alert)}</span>${when ? `<span class="sub">atualizado ${esc(when)}</span>` : ""}` : "");
    return `<article class="card" data-conta="${esc(id)}">${html}</article>`;
  }

  // Contas separadas como na aba Clientes: dono recorrente → Recorrentes Psicólogos; o resto → Projetos Psicólogos
  function renderAdsBox(kind) {
    const cols = ADS_COLS, { col, dir } = ads.sort[kind];
    // Ordem padrão = a mesma da aba Clientes (revisão mais recente no topo)
    const order = byReview(kind === "rec" ? RECORRENTES.concat(RECORRENTES_PSICOLOGOS) : PROJETOS).map(c => c.conta);
    const pos = r => { const k = order.indexOf(r[1].trim()); return k < 0 ? Infinity : k; };
    const list = ads.rows
      .filter(r => REC_ACCOUNTS.has(r[1].trim()) === (kind === "rec"))
      .sort((a, b) => pos(a) - pos(b))
      .map((r, i) => ({ r, i }));
    if (col != null) {
      const { key, type } = cols[col];
      const isEmpty = v => v == null || v === "" || Number.isNaN(v);
      list.sort((a, b) => {
        const va = key(a.r), vb = key(b.r);
        if (isEmpty(va) || isEmpty(vb)) return (isEmpty(va) - isEmpty(vb)) || a.i - b.i;
        const cmp = type === "num" ? va - vb : String(va).localeCompare(String(vb), "pt-BR");
        return cmp * dir || a.i - b.i;
      });
    }
    const head = cols.map((h, i) => {
      const sort = col === i ? (dir === 1 ? "ascending" : "descending") : "none";
      const arrow = col === i ? (dir === 1 ? "▲" : "▼") : (h.type === "num" ? "▼" : "▲");
      return `<button type="button" class="sort${h.gstart ? " gstart" : ""}" data-ads-kind="${kind}" data-ads-col="${i}" aria-sort="${sort}" title="Ordenar por ${h.full || h.label}">${h.label}<span class="arrow">${arrow}</span></button>`;
    }).join("");
    // Linha de cima do cabeçalho: nome de cada métrica, cobrindo as suas três colunas
    const groups = GROUPS.map(([g], k) => `<div class="group" style="grid-column: ${3 + k * 3} / span 3">${g}</div>`).join("");
    document.getElementById(`ads-${kind}`).innerHTML = `<div class="card head">${groups}${head}</div>` + list.map(x => adsCard(x.r)).join("");
    document.getElementById(`count-ads-${kind}`).textContent = `${list.length} conta${list.length === 1 ? "" : "s"}`;
  }
  function renderAds() { renderAdsBox("rec"); renderAdsBox("proj"); }

  function loadAds() {
    if (ads.rows || ads.loading) return;
    ads.loading = true;
    fetch(SHEET_CSV)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(text => {
        // Só as contas que têm aba particular visível na planilha (lista CONTAS_GOOGLE_ADS)
        ads.rows = parseCSV(text).slice(1).filter(r => r[1] && CONTAS_GOOGLE_ADS.includes(r[1].trim()));
        // "Atualizado" da aba = horário mais recente entre as contas
        const stamp = s => { const m = (s || "").match(/(\d\d)\/(\d\d)\/(\d{4}) (\d\d):(\d\d)/); return m ? +(m[3] + m[2] + m[1] + m[4] + m[5]) : 0; };
        const latest = ads.rows.reduce((a, r) => stamp(r[32]) > stamp(a) ? r[32] : a, "");
        const m = latest.match(/(\d\d\/\d\d\/\d{4}) (\d\d:\d\d)/);
        ads.updated = m ? `Planilha atualizada em ${m[1]} às ${m[2]}` : "";
        renderAds();
        showView(currentView());
      })
      .catch(() => {
        ads.loading = false;
        ["rec", "proj"].forEach(k => { document.getElementById(`ads-${k}`).innerHTML =
          `<p class="ads-msg">Não foi possível carregar a planilha agora. Tente recarregar a página.</p>`; });
      });
  }

  document.addEventListener("click", e => {
    const b = e.target.closest(".sort[data-ads-col]");
    if (!b) return;
    const kind = b.dataset.adsKind, s = ads.sort[kind];
    const i = Number(b.dataset.adsCol), first = ADS_COLS[i].type === "num" ? -1 : 1;
    if (s.col !== i) { s.col = i; s.dir = first; }
    else if (s.dir === first) s.dir = -first;
    else s.col = null;
    renderAdsBox(kind);
  });

  /* ===== Abas: #clientes (padrão) e #google-ads ===== */
  const currentView = () => location.hash.startsWith("#google-ads") ? "ads" : "clientes";
  function showView(view) {
    document.querySelectorAll("[data-panel]").forEach(p => { p.hidden = p.dataset.panel !== view; });
    document.querySelectorAll("[data-view]").forEach(a => {
      if (a.dataset.view === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.getElementById("updated").textContent =
      view === "ads" ? (ads.updated || "Carregando…") : `Atualizado em ${ATUALIZADO_EM}`;
    document.title = view === "ads" ? "Google Ads · Clientes" : "Clientes";
    if (view === "ads") loadAds();
  }
  window.addEventListener("hashchange", () => showView(currentView()));
  showView(currentView());
})();
</script>
</body>
</html>
