<!-- O painel de clientes vai criptografado com a senha (AES-256 + HMAC, chave por PBKDF2-SHA256).
     Sem a senha, esta página não tem como mostrar nada. -->
<style>
  :root { --bg: #0f0f0f; --box: #143a2b; --box-line: #2a5a45; --box-ink: #e4eee8; --box-label: #a3c2b1; --title: #f0d78c; --danger: #ffb4a8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--box-ink);
    font: 14px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  form { width: min(340px, 100%); padding: 26px 26px 22px; background: var(--box); border: 1px solid var(--box-line); }
  .topo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
  .topo svg { display: block; flex: none; }
  label.k { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--title); }
  input[type="password"] {
    width: 100%; padding: 10px 12px; border: 1px solid var(--box-line); border-radius: 0;
    background: #fff; color: #1a1f24; font: inherit; font-size: 15px; letter-spacing: .08em;
  }
  input[type="password"]:focus { outline: 2px solid var(--title); outline-offset: 1px; }
  .lembrar { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; font-size: 12.5px; color: var(--box-label); cursor: pointer; }
  button {
    width: 100%; padding: 10px 12px; border: 0; border-radius: 0; cursor: pointer;
    background: var(--title); color: #1a1f24; font: inherit; font-weight: 700;
  }
  button:disabled { opacity: .6; cursor: default; }
  .erro { min-height: 18px; margin: 10px 0 0; font-size: 12.5px; color: var(--danger); }
</style>
</head>
<body>
<form id="cadeado" autocomplete="on" hidden>
  <div class="topo">

    </svg>
    <span>Clientes</span>
  </div>
  <input type="text" name="usuario" value="clientes" autocomplete="username" hidden>
  <label class="k" for="senha">Senha</label>
  <input type="password" id="senha" autocomplete="current-password" required>
  <label class="lembrar"><input type="checkbox" id="lembrar" checked> Lembrar neste computador</label>
  <button type="submit" id="entrar">Entrar</button>
  <p class="erro" id="erro" role="alert"></p>
</form>

  const GUARDADA = "clientes-chave"; // chave já derivada, guardada só neste navegador quando "Lembrar" está marcado

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const paraB64 = u => btoa(Array.from(u, c => String.fromCharCode(c)).join(""));
  const ler = () => { try { return localStorage.getItem(GUARDADA); } catch (e) { return null; } };
  const gravar = v => { try { v ? localStorage.setItem(GUARDADA, v) : localStorage.removeItem(GUARDADA); } catch (e) {} };

  async function derivar(senha) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" }, base, 512));
  }

  // Confere a assinatura (senha errada = assinatura não bate), decifra e troca esta página pelo painel
  async function abrir(bits) {
    const aes = await crypto.subtle.importKey("raw", bits.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
    const mac = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const iv = b64(PAYLOAD.iv), ct = b64(PAYLOAD.ct);
    const assinado = new Uint8Array(iv.length + ct.length);
    assinado.set(iv); assinado.set(ct, iv.length);
    if (!await crypto.subtle.verify("HMAC", mac, b64(PAYLOAD.mac), assinado)) return false;
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, aes, ct));
    // Só troca a página depois que esta terminou de carregar; antes disso o document.write escreveria por cima dela
    if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, { once: true }));
    document.open(); document.write(html); document.close();
    return true;
  }

  const form = document.getElementById("cadeado");
  const erro = document.getElementById("erro");
  const entrar = document.getElementById("entrar");

  form.addEventListener("submit", async e => {
    e.preventDefault();
    erro.textContent = "";
    entrar.disabled = true; entrar.textContent = "Abrindo…";
    try {
      const bits = await derivar(document.getElementById("senha").value);
      const lembrar = document.getElementById("lembrar").checked;
      gravar(lembrar ? paraB64(bits) : null);
      if (await abrir(bits)) return;
      gravar(null);
      erro.textContent = "Senha incorreta.";
    } catch (err) {
      erro.textContent = "Não foi possível abrir. Recarregue a página e tente de novo.";
    }
    entrar.disabled = false; entrar.textContent = "Entrar";
    document.getElementById("senha").select();
  });

  (async () => {
    const guardada = ler();
    if (guardada) {
      try { if (await abrir(b64(guardada))) return; } catch (e) {}
      gravar(null); // senha mudou ou chave inválida: pede de novo
    }
    form.hidden = false;
    document.getElementById("senha").focus();
  })();
})();
