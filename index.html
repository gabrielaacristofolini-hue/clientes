<style>
  :root {
    --bg: #0f0f0f;
    --box: #fcf4d8;
    --box-line: #ede0b3;
    --surface: #ffffff;
    --ink: #1a1f24;
    --label: #8a929b;
    --soft-ink: #4a535c;
    --line: #f0e9d0;
    --accent: #2c6a4c;
    --accent-soft: #e8f3ec;
    --accent-soft-ink: #24593f;
    --warn-ink: #b45309;
    --danger-ink: #c0261b;
    --shadow: 0 1px 2px rgba(16, 24, 32, .04);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; color-scheme: light; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { padding: 24px 40px 32px; }
  @media (max-width: 600px) { .wrap { padding: 16px; } }

  /* Caixas de clientes uma embaixo da outra, com o cabeçalho em cima; o conjunto fica centralizado */
  .layout { display: grid; grid-template-columns: minmax(0, max-content); justify-content: center; align-items: start; gap: 18px; }
  .top { grid-column: 1 / -1; }

  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 2px 14px;
    border-bottom: 1px solid rgba(252, 244, 216, .14);
    color: var(--box);
    font-size: 16px; font-weight: 700; letter-spacing: .02em;
  }
  .top svg { display: block; flex: none; }
  .top { flex-wrap: wrap; }

  [hidden] { display: none !important; }

  /* Dados do Google Ads no card de cada psicólogo (lidos ao vivo da aba "Geral" da planilha):
     uma faixa embaixo da observação, com Hoje, Ontem e 7 dias lado a lado em cada métrica */
  .ads-strip {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 96px 86px 74px 78px 88px 52px 56px 104px 72px 72px minmax(170px, 1fr);
    margin: 8px 14px 0; padding-top: 7px;
    border-top: 1px dashed var(--box-line);
    font-variant-numeric: tabular-nums;
  }
  .ads-strip > div { min-width: 0; padding: 0 8px; border-left: 1px solid var(--line); white-space: nowrap; }
  .ads-strip > div:first-child { padding-left: 0; border-left: 0; }
  .ads-strip > .gs { border-left: 2px solid var(--box-line); }
  .ads-strip .k { display: block; font-size: 11px; color: var(--label); }
  .ads-strip .v { display: block; font-size: 13px; font-weight: 500; }
  .ads-strip .alert-cell .sub { display: inline; margin-left: 6px; }
  .ads-strip.none { display: block; color: var(--label); font-size: 12.5px; }
  /* Linha da promoção do Google (gastar R$ 1.200 até o prazo), embaixo da faixa do Google Ads */
  .promo {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 182px 330px 150px minmax(0, 1fr);
    margin: 7px 14px 0; padding-top: 7px;
    border-top: 1px dashed var(--line);
    font-variant-numeric: tabular-nums;
  }
  .promo > div { min-width: 0; padding: 0 12px; border-left: 1px solid var(--line); white-space: nowrap; }
  .promo > div:first-child { padding-left: 0; border-left: 0; }
  .promo .k { display: block; font-size: 11px; color: var(--label); }
  .promo .v { display: block; font-size: 13px; font-weight: 500; }
  .promo .sub { display: inline; margin-left: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; height: 18px; }
  .bar { flex: 1; height: 7px; border-radius: 999px; background: #ece9df; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: inherit; background: var(--soft-ink); }
  .bar-row .pct { font-size: 12px; font-weight: 600; color: var(--soft-ink); min-width: 34px; text-align: right; }
  /* Caixas dos psicólogos ficam um pouco mais largas para caber a faixa do Google Ads */
  .cards.psi { min-width: 1060px; }
  section.wide { overflow-x: auto; }
  .sub { display: block; margin-top: 1px; font-size: 11.5px; font-weight: 500; letter-spacing: 0; color: var(--label); }
  /* Alerta da conta: só "Crítico" e "Atenção" ganham cor; o resto (ex.: "Tudo certo") é texto normal */
  .alert { display: inline-block; font-size: 12.5px; font-weight: 500; }
  .alert.ok { color: var(--soft-ink); }
  .alert.warn, .alert.crit { padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .alert.warn { background: #fff0d6; color: var(--warn-ink); }
  .alert.crit { background: #fde5e2; color: var(--danger-ink); }
  /* Uma caixa por grupo (Recorrentes, Recorrentes · Psicólogos, Projetos · Psicólogos), uma embaixo
     da outra e com a mesma largura. A lista de tarefas (TAREFAS) fica no topo à
     direita e acompanha a rolagem; em telas menores, vai para cima das caixas */
  .groups { display: grid; grid-template-columns: minmax(0, max-content) max-content; justify-content: center; align-items: start; gap: 22px 18px; }
  .groups > section { grid-column: 1; }
  .groups > .side { grid-column: 2; grid-row: 1 / span 3; position: sticky; top: 16px; }
  .groups:has(> .side[hidden]) { grid-template-columns: minmax(0, max-content); } /* sem a tabelinha, as caixas ficam centralizadas */
  /* .stack: sem espaço para a lista ao lado (ver fitSide), ela vai para cima das caixas */
  .groups.stack { grid-template-columns: minmax(0, max-content); }
  .groups.stack > .side { grid-column: 1; grid-row: 1; position: static; }
  @media (max-width: 1460px) {
    .groups { grid-template-columns: minmax(0, max-content); }
    .groups > .side { grid-column: 1; grid-row: 1; position: static; }
  }
  .side {
    min-width: 230px;
    background: var(--surface); border: 1px solid var(--box-line); border-radius: 12px;
    padding: 12px 16px 10px; font-size: 13px; color: var(--soft-ink);
  }
  .side h3 { margin: 0 0 4px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--label); }
  .side h4 { margin: 8px 0 2px; font-size: 12.5px; font-weight: 500; color: var(--ink); }
  .side h3 + h4 { margin-top: 2px; }
  .side ul { margin: 0; padding-left: 16px; }
  .side li { padding: 1px 0; white-space: nowrap; } /* uma tarefa por linha, sem quebrar */
  .side li::marker { color: var(--label); }
  .side .when { color: var(--label); }
  .side .block + .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .side .block > h4:first-child { margin-top: 4px; }

  /* Cada seção (Recorrentes, Recorrentes · Psicólogos, Projetos · Psicólogos) fica dentro de uma caixa com contorno */
  section {
    min-width: 0;
    background: var(--box);
    border: 1px solid var(--box-line);
    border-radius: 14px;
    padding: 10px 12px 12px;
  }
  section h2 {
    display: flex; align-items: baseline; gap: 8px;
    margin: 0 0 4px 2px; font-size: 12px; font-weight: 600; color: var(--accent);
    text-transform: uppercase; letter-spacing: .08em;
  }
  section h2 span { color: var(--label); font-weight: 500; text-transform: none; letter-spacing: 0; }

  /* As colunas são compartilhadas por todos os cards da seção (subgrid),
     então cada coluna tem a largura do seu maior conteúdo e nada quebra linha. */
  .cards { display: grid; grid-template-columns: var(--cols); row-gap: 6px; }
  /* Larguras fixas para as colunas das duas caixas ficarem alinhadas entre si */
  .cards { --cols: 204px 182px 138px 76px 112px 112px 112px minmax(0, 1fr); }

  .card {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: subgrid;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 0;
    box-shadow: var(--shadow);
  }
  .card.head { background: transparent; border-color: transparent; box-shadow: none; padding: 0; }

  .c {
    min-width: 0;
    padding: 0 14px;
    border-left: 1px solid var(--line);
    font-variant-numeric: tabular-nums; font-weight: 500;
    white-space: nowrap;
  }
  .c:first-child { border-left: 0; }
  .c.name { font-weight: 700; letter-spacing: .01em; }
  .seg { display: block; margin-top: 1px; font-size: 11.5px; font-weight: 500; letter-spacing: 0; color: var(--label); }
  /* Símbolo da plataforma (Google / Meta) ao lado do nome */
  .plat { display: inline-block; width: 14px; height: 14px; margin-left: 6px; vertical-align: -2px; }
  .plat + .plat { margin-left: 4px; }
  .c.empty { color: var(--label); }

  /* Títulos das colunas: clicar ordena */
  .sort {
    display: flex; align-items: center; gap: 4px;
    width: 100%; padding: 4px 14px;
    border: 0; border-left: 1px solid transparent; background: none;
    font: inherit; font-size: 11.5px; font-weight: 500; color: var(--label);
    white-space: nowrap; cursor: pointer; text-align: left;
  }
  .sort:hover { color: var(--ink); }
  .sort[aria-sort="ascending"], .sort[aria-sort="descending"] { color: var(--ink); font-weight: 600; }
  .sort .arrow { font-size: 10px; opacity: 0; }
  .sort:hover .arrow { opacity: .4; }
  .sort[aria-sort="ascending"] .arrow, .sort[aria-sort="descending"] .arrow { opacity: 1; }


  .note {
    grid-column: 1 / -1;
    contain: inline-size; /* observação longa quebra linha em vez de alargar a caixa */
    margin: 9px 14px 0;
    padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--soft-ink);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .note mark.urgent { background: #fde0c2; }
  .note mark {
    padding: 0 4px; border-radius: 3px;
    background: #fdf1c7; color: inherit;
  }
  .note::before {
    content: "Obs:";
    margin-right: 6px;
    font-size: 11px; font-weight: 700; color: var(--label);
    text-transform: uppercase; letter-spacing: .05em;
  }

  .top .updated { margin-left: auto; padding: 3px 10px; border: 1px solid rgba(252, 244, 216, .25); border-radius: 999px; font-size: 12.5px; font-weight: 500; letter-spacing: 0; }

  /* Telas menores: cada cliente vira um bloco, com rótulos em cada campo */
  @media (max-width: 1000px) {
    body { font-size: 14px; }
    .cards { display: flex; flex-direction: column; gap: 9px; }
    .card.head { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
    .card.head .sort { width: auto; padding: 3px 9px; border: 1px solid var(--box-line); border-radius: 999px; background: var(--surface); }
    .card { grid-template-columns: repeat(6, 1fr); gap: 6px 12px; padding: 12px 14px; border-radius: 10px; }
    .c { grid-column: span 2; padding: 0; border-left: 0; }
    .c.name { grid-column: 1 / -1; font-size: 15px; }
    .c:nth-child(2), .c:nth-child(3) { grid-column: span 3; }
    .c[data-label]::before {
      content: attr(data-label);
      display: block;
      font-size: 11.5px; font-weight: 500; color: var(--label);
    }
    .note { margin: 0; padding-top: 8px; }

    /* Faixa do Google Ads no celular: orçamento e alerta em linha inteira; cada métrica numa linha (Hoje | Ontem | 7 dias) */
    .cards.psi { min-width: 0; }
    .ads-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; margin: 0; padding-top: 8px; }
    .ads-strip > div, .ads-strip > .gs { padding: 0; border-left: 0; white-space: normal; }
    .ads-strip > div:first-child, .ads-strip > div:last-child { grid-column: 1 / -1; }
    .ads-strip .alert-cell .sub { display: block; margin-left: 0; }
    .promo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; margin: 0; padding-top: 8px; }
    .promo > div { padding: 0; border-left: 0; white-space: normal; }
    .promo > .bar-cell { grid-column: 1 / -1; order: -1; }
    .promo .sub { display: block; margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
    <header class="top">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
        <clipPath id="avatar-clip"><circle cx="32" cy="32" r="32"/></clipPath>
        <g clip-path="url(#avatar-clip)">
          <rect width="64" height="64" fill="#2c6a4c"/>
          <circle cx="32" cy="25" r="11" fill="#fff"/>
          <path d="M9 68c0-15 10-25 23-25s23 10 23 25z" fill="#fff"/>
        </g>
      </svg>
      <span>Clientes</span>
      <span class="updated" id="updated"></span>
    </header>

    <!-- Uma caixa por grupo, uma embaixo da outra; a tabelinha de pendências fica no topo à direita -->
    <div class="groups">
      <aside class="side" id="side" aria-label="Pendências"></aside>

      <section id="box-rec">
        <h2>Recorrentes <span id="count-rec"></span></h2>
        <div class="cards" id="cards-rec"></div>
      </section>

      <section id="box-recpsi">
        <h2>Recorrentes · Psicólogos <span id="count-recpsi"></span></h2>
        <div class="cards" id="cards-recpsi"></div>
      </section>

      <section id="box-proj">
        <h2>Projetos · Psicólogos <span id="count-proj"></span></h2>
        <div class="cards" id="cards-proj"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function () {
  const DAY = 86400000;

  function parseDate(s) {
    if (!s) return null;
    const [d, m, y] = s.split("/").map(Number);
    return Date.UTC(y, m - 1, d);
  }
  function fmtDate(t) {
    const d = new Date(t);
    return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + "/" + d.getUTCFullYear();
  }
  function today() {
    const n = new Date();
    return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  }
  const money = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function cell(label, value, cls, title) {
    const empty = value === "" || value == null;
    return `<div class="c ${cls || ""} ${empty ? "empty" : ""}" data-label="${label}"${title ? ` title="${title}"` : ""}>${empty ? "—" : value}</div>`;
  }

  function nextOf(c) {
    const last = parseDate(c.revisao);
    return last == null ? null : last + 7 * DAY;
  }

  function nextCell(c) {
    const next = nextOf(c);
    if (next == null) return cell("Próxima revisão", "", "next");
    const diff = Math.round((next - today()) / DAY);
    let cls = "next", title = "";
    if (diff < 0) { cls += " late"; title = `Atrasada há ${-diff} dia${diff === -1 ? "" : "s"}`; }
    else if (diff === 0) { cls += " today"; title = "Revisão hoje"; }
    return cell("Próxima revisão", fmtDate(next), cls, title);
  }

  /* ===== Grupos de clientes (uma caixa para cada, uma embaixo da outra) ===== */
  const VIEWS = {
    rec:    { title: "Recorrentes",              data: RECORRENTES },
    recpsi: { title: "Recorrentes · Psicólogos", data: RECORRENTES_PSICOLOGOS, ads: true },
    proj:   { title: "Projetos · Psicólogos",    data: PROJETOS,               ads: true },
  };

  /* Colunas (iguais em todas as abas). O tipo define o primeiro clique:
     datas e valores começam do mais recente/maior; textos, de A a Z. */
  const COLS = [
    { label: "Cliente", key: c => c.nome, type: "text" },
    { label: "Última revisão/alteração", key: c => parseDate(c.revisao), type: "num" },
    { label: "Próxima revisão", key: nextOf, type: "num" },
    { label: "Script", key: c => c.script, type: "text" },
    { label: "Mensal", key: c => c.mensal, type: "num" },
    { label: "Pagamento", key: c => c.pagamento, type: "text" },
    { label: "Início", key: c => parseDate(c.inicio), type: "num" },
  ];

  const PLATFORMS = {
    google: { title: "Google Ads", svg: `<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>` },
    meta: { title: "Meta Ads", svg: `<svg viewBox="0 0 24 24"><path d="M12 12c-2-3-3.6-5.2-5.6-5.2S2.8 9 2.8 12s1.6 5.2 3.6 5.2S10 15 12 12s3.6-5.2 5.6-5.2 3.6 2.2 3.6 5.2-1.6 5.2-3.6 5.2S14 15 12 12z" fill="none" stroke="#0866FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` },
  };

  /* ===== Google Ads: lido ao vivo da aba "Geral" da planilha do Google ===== */
  const SHEET_CSV = "https://docs.google.com/spreadsheets/d/14wsRMmTuI7v7nT2yy6AXYKzlhBHNkznw4XXsen69xxE/gviz/tq?tqx=out:csv&sheet=Geral";
  // Colunas da planilha: 0 cliente, 1 ID, 2 status, 3 orçamento/dia; depois cada período (Hoje, Ontem,
  // Últimos 7 dias, Todo o período) tem 9 métricas, seguidas de Alertas e Atualizado em. As colunas são
  // achadas pelo título do cabeçalho, então a página continua certa se a planilha ganhar colunas novas.
  // Das 9 métricas (Custo, Impr., Cliques, CTR, CPC méd., CPM, Conv., Taxa conv., Custo/conv.)
  // mostramos Custo (posição 0), Conv. (6) e Custo/conv. (8), cada uma com hoje / ontem / 7 dias lado a lado.
  const PERIODS = [["hoje", "hoje"], ["ontem", "ontem"], ["7 dias", "semana"]];
  const GROUPS = [["Gasto", 0], ["Conv.", 6], ["Custo/conv.", 8]];
  function sheetColumns(header) {
    const h = header.map(s => (s || "").trim().toUpperCase());
    const find = (re, fallback) => { const i = h.findIndex(s => re.test(s)); return i < 0 ? fallback : i; };
    return {
      hoje: find(/^HOJE/, 4), ontem: find(/^ONTEM/, 13), semana: find(/^ÚLTIMOS 7 DIAS/, 22),
      total: find(/^TODO O PERÍODO/, -1), alerta: find(/^ALERTAS/, 40), atualizado: find(/^ATUALIZADO/, 41),
    };
  }

  /* Promoção do Google: gastar R$ 1.200 (todo o período) até o prazo do campo "promocao".
     O valor por dia é calculado para fechar a meta FOLGA_DIAS antes do prazo. */
  const PROMO_META = 1200;
  const FOLGA_DIAS = 3;
  const toNumber = s => parseFloat(String(s || "").replace(/[^\d,-]/g, "").replace(",", ".")) || 0;

  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  const blank = v => !v || v.trim() === "" || v.trim() === "–";

  // Linha da planilha de cada conta (pelo ID), só das contas com aba particular visível (CONTAS_GOOGLE_ADS)
  const ads = { byAccount: null, col: null, status: "loading", updated: "" };

  function adsStrip(c) {
    if (!c.conta) return `<div class="ads-strip none">Sem conta no Google Ads.</div>`;
    if (ads.status === "loading") return `<div class="ads-strip none">Carregando dados do Google Ads…</div>`;
    if (ads.status === "error") return `<div class="ads-strip none">Não foi possível carregar os dados do Google Ads. Tente recarregar a página.</div>`;
    const r = ads.byAccount[c.conta];
    if (!r) return `<div class="ads-strip none">Conta sem dados na planilha.</div>`;
    const v = x => blank(x) ? "—" : esc(x.trim());
    let html = `<div><span class="k">Orçamento/dia</span><span class="v">${v(r[3])}</span></div>`;
    const col = ads.col;
    GROUPS.forEach(([g, off]) => PERIODS.forEach(([p, key], j) => {
      html += `<div${j === 0 ? ` class="gs"` : ""}><span class="k">${j === 0 ? `${g} · ${p}` : p}</span><span class="v">${v(r[col[key] + off])}</span></div>`;
    }));
    const alert = (r[col.alerta] || "").trim();
    const level = /^crítico/i.test(alert) ? "crit" : /^atenção/i.test(alert) ? "warn" : "ok";
    const when = (r[col.atualizado] || "").trim().replace(/^(\d\d\/\d\d)\/\d{4}/, "$1");
    html += `<div class="gs alert-cell"><span class="k">Alerta da conta</span>` +
      (alert ? `<span class="alert ${level}">${esc(alert)}</span>` : "—") +
      (when ? `<span class="sub">atualizado ${esc(when)}</span>` : "") + `</div>`;
    return `<div class="ads-strip" title="${esc(r[0].trim())} · ${esc(r[1].trim())} · ${esc((r[2] || "").trim())}">${html}</div>` + promoLine(c, r);
  }

  // Linha da promoção: gasto de todo o período, barrinha até R$ 1.200, prazo e quanto investir por dia
  function promoLine(c, r) {
    if (ads.col.total < 0) return "";
    const gasto = toNumber(r[ads.col.total]);
    const falta = Math.max(PROMO_META - gasto, 0);
    const pct = Math.min(gasto / PROMO_META, 1);
    let html = `<div><span class="k">Gasto · todo o período</span><span class="v">${money(gasto)}</span></div>` +
      `<div class="bar-cell"><span class="k">Promoção · meta ${money(PROMO_META)}` +
      (falta > 0 ? ` · faltam ${money(falta)}` : "") + `</span>` +
      `<span class="bar-row"><span class="bar"><i style="width:${(pct * 100).toFixed(1)}%"></i></span>` +
      `<span class="pct">${Math.floor(pct * 100)}%</span></span></div>`;

    const prazo = isDate(c.promocao) ? parseDate(c.promocao) : null;
    const dias = prazo == null ? null : Math.round((prazo - today()) / DAY);
    let prazoTxt = "—", porDia = "—", porDiaSub = "";
    if (prazo != null) {
      prazoTxt = fmtDate(prazo).slice(0, 5) + `<span class="sub">${
        dias > 1 ? `faltam ${dias} dias` : dias === 1 ? "amanhã" : dias === 0 ? "hoje" : "prazo encerrado"}</span>`;
    }
    if (falta === 0) porDia = "Meta atingida" + (c.promocaoNota ? ` – ${esc(c.promocaoNota)}` : ""); // ex.: "aguardando análise do Google"
    else if (dias != null && dias >= 0) {
      // Fecha a meta FOLGA_DIAS antes do prazo; se não houver tanto tempo, usa os dias que restam
      const diasUteis = dias - FOLGA_DIAS >= 1 ? dias - FOLGA_DIAS : Math.max(dias, 1);
      porDia = money(falta / diasUteis);
      porDiaSub = `<span class="sub">para fechar até ${fmtDate(today() + diasUteis * DAY).slice(0, 5)}</span>`;
    }
    html += `<div><span class="k">Prazo da promoção</span><span class="v">${prazoTxt}</span></div>` +
      `<div><span class="k">Investir por dia daqui para frente</span><span class="v">${porDia}${porDiaSub}</span></div>`;
    return `<div class="promo">${html}</div>`;
  }

  function card(c, withAds) {
    const plats = (c.plataformas || []).filter(p => PLATFORMS[p])
      .map(p => `<span class="plat" title="${PLATFORMS[p].title}" role="img" aria-label="${PLATFORMS[p].title}">${PLATFORMS[p].svg}</span>`).join("");
    let html = `<div class="c name">${esc(c.nome)}${plats}<span class="seg">${c.segmento ? esc(c.segmento) : "&nbsp;"}</span></div>`
      + cell("Última revisão/alteração", esc(c.revisao))
      + nextCell(c)
      + cell("Script", esc(c.script))
      + cell("Mensal", c.mensal != null ? money(c.mensal) : "")
      + cell("Pagamento", c.pagamento ? `<span class="pill">${esc(c.pagamento)}</span>` : "")
      + cell("Início", esc(c.inicio));
    // Marcadores desligados por enquanto: **trecho** e !!trecho!! aparecem como texto normal.
    // Para voltar, troque "$1" por "<mark>$1</mark>" (amarelo) e por `<mark class="urgent">$1</mark>` (laranja).
    const obs = c.obs ? esc(c.obs)
      .replace(/\*\*(.+?)\*\*/g, "$1")
      .replace(/!!(.+?)!!/g, "$1") : "&nbsp;";
    html += `<p class="note">${obs}</p>`; // a linha de OBS aparece sempre, mesmo vazia
    if (withAds) html += adsStrip(c);
    return `<article class="card" data-cliente="${esc(c.nome)}">${html}</article>`;
  }

  // Ordem padrão: revisão mais recente no topo; mesma data → ordem alfabética; sem revisão no fim
  function byReview(list) {
    return list.slice().sort((a, b) =>
      (parseDate(b.revisao) ?? -Infinity) - (parseDate(a.revisao) ?? -Infinity) ||
      a.nome.localeCompare(b.nome, "pt-BR"));
  }

  // Ordenação de cada grupo: coluna (índice) e direção (1 = crescente, -1 = decrescente)
  const state = { rec: { col: null, dir: 1 }, recpsi: { col: null, dir: 1 }, proj: { col: null, dir: 1 } };

  function sorted(view) {
    const { col, dir } = state[view];
    const list = byReview(VIEWS[view].data).map((c, i) => ({ c, i }));
    if (col == null) return list.map(x => x.c);
    const { key, type } = COLS[col];
    const isEmpty = v => v == null || v === "";
    list.sort((a, b) => {
      const va = key(a.c), vb = key(b.c);
      if (isEmpty(va) || isEmpty(vb)) return (isEmpty(va) - isEmpty(vb)) || a.i - b.i; // vazios sempre no fim
      const cmp = type === "num" ? va - vb : String(va).localeCompare(String(vb), "pt-BR");
      return cmp * dir || a.i - b.i;
    });
    return list.map(x => x.c);
  }

  const isDate = d => /^\d\d\/\d\d\/\d{4}$/.test(d || "");

  /* Lista de tarefas no topo à direita, vinda de TAREFAS (montada à mão).
     A antiga tabelinha automática (verificação / saldo / promoção) está no histórico do git. */
  function renderSide() {
    const side = document.getElementById("side");
    side.hidden = !TAREFAS.length; // sem tarefas, a lista some e as caixas voltam para o centro
    side.innerHTML = `<h3>Tarefas</h3>` + TAREFAS.map(t =>
      `<div class="block"><h4>${esc(t.cliente)}</h4><ul>` +
      t.itens.map(([tarefa, detalhe]) => `<li>${esc(tarefa)}${detalhe ? ` <span class="when">· ${esc(detalhe)}</span>` : ""}</li>`).join("") +
      `</ul></div>`).join("");
    fitSide();
  }

  // A lista cresce para cada tarefa caber numa linha; se não couber ao lado das caixas, vai para cima delas
  function fitSide() {
    const g = document.querySelector(".groups");
    g.classList.remove("stack");
    const over = el => el.scrollWidth > el.clientWidth + 1;
    if (over(g) || [...g.children].some(over)) g.classList.add("stack");
  }
  addEventListener("resize", fitSide);

  function render(view) {
    const v = VIEWS[view], { col, dir } = state[view];
    const head = COLS.map((h, i) => {
      const sort = col === i ? (dir === 1 ? "ascending" : "descending") : "none";
      const arrow = col === i ? (dir === 1 ? "▲" : "▼") : (h.type === "num" ? "▼" : "▲");
      return `<button type="button" class="sort" data-kind="${view}" data-col="${i}" aria-sort="${sort}" title="Ordenar por ${h.label}">${h.label}<span class="arrow">${arrow}</span></button>`;
    }).join("");
    const cards = document.getElementById(`cards-${view}`);
    cards.classList.toggle("psi", !!v.ads);
    document.getElementById(`box-${view}`).classList.toggle("wide", !!v.ads);
    cards.innerHTML = `<div class="card head">${head}</div>` + sorted(view).map(c => card(c, v.ads)).join("");
    document.getElementById(`count-${view}`).textContent = `${v.data.length} cliente${v.data.length === 1 ? "" : "s"}`;
  }

  // 1º clique: ordena (datas e valores do maior para o menor; textos de A a Z).
  // 2º clique: inverte. 3º clique: volta à ordem padrão.
  document.addEventListener("click", e => {
    const b = e.target.closest(".sort[data-kind]");
    if (!b) return;
    const view = b.dataset.kind, i = Number(b.dataset.col);
    const s = state[view], first = COLS[i].type === "num" ? -1 : 1;
    if (s.col !== i) { s.col = i; s.dir = first; }
    else if (s.dir === first) s.dir = -first;
    else s.col = null;
    render(view);
  });

  // Desenha os três grupos (de novo quando os dados do Google Ads chegam)
  function renderAll() {
    document.getElementById("updated").textContent = `Atualizado em ${ATUALIZADO_EM}` +
      (ads.updated ? ` · Google Ads ${ads.updated}` : "");
    Object.keys(VIEWS).forEach(render);
    renderSide();
  }
  renderAll();

  fetch(SHEET_CSV)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const all = parseCSV(text);
      ads.col = sheetColumns(all[0] || []);
      const rows = all.slice(1).filter(r => r[1] && CONTAS_GOOGLE_ADS.includes(r[1].trim()));
      ads.byAccount = Object.fromEntries(rows.map(r => [r[1].trim(), r]));
      // Horário mais recente entre as contas
      const stamp = s => { const m = (s || "").match(/(\d\d)\/(\d\d)\/(\d{4}) (\d\d):(\d\d)/); return m ? +(m[3] + m[2] + m[1] + m[4] + m[5]) : 0; };
      const latest = rows.reduce((a, r) => stamp(r[ads.col.atualizado]) > stamp(a) ? r[ads.col.atualizado] : a, "");
      const m = latest.match(/(\d\d\/\d\d)\/\d{4} (\d\d:\d\d)/);
      ads.updated = m ? `de ${m[1]} às ${m[2]}` : "";
      ads.status = "ok";
    })
    .catch(() => { ads.status = "error"; })
    .then(renderAll);
})();
</script>
</body>
</html>
